<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>Testy CantatePresenter Web</title></head>
<body>
<pre id="result">running</pre>
<script>
  // Błąd ładowania modułu też ma trafić do wyniku, inaczej run-tests.sh widzi tylko „running”.
  const report = (message) => {
    const result = JSON.stringify({ passed: 0, failed: 1, failures: [{ name: "ładowanie", error: String(message) }] });
    document.getElementById("result").textContent = result;
    fetch("/__test-result", { method: "POST", body: result }).catch(() => {});
  };
  window.addEventListener("error", (event) => report(event.message + " @ " + event.filename + ":" + event.lineno));
  window.addEventListener("unhandledrejection", (event) => report(event.reason));
</script>
<script type="module">
  import { run } from "./harness.js";
  import "./core.test.js";
  import "./data.test.js";
  import "./store.test.js";
  await run();
</script>
</body>
</html>

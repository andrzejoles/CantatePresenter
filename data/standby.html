<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holyrics Mac — Ekran Czuwania</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle at 50% 40%, #1e2640 0%, #0d111d 70%, #07090e 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle ambient glow behind logo */
        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.22) 0%, rgba(6, 182, 212, 0.12) 50%, transparent 75%);
            border-radius: 50%;
            filter: blur(50px);
            z-index: 1;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .container {
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px;
        }

        /* Custom Vector Logo */
        .logo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            filter: drop-shadow(0 12px 30px rgba(79, 70, 229, 0.4));
        }

        .logo-svg {
            width: 100%;
            height: 100%;
        }

        /* Typography */
        h1.app-title {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 60%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.1;
        }

        .app-subtitle {
            font-size: 1.35rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #38bdf8;
            margin-top: -6px;
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 0.88rem;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.02em;
            backdrop-filter: blur(10px);
            margin-top: 6px;
        }

        .version-badge .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* Bottom status & clock */
        .footer-status {
            position: absolute;
            bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.92rem;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .live-clock {
            font-size: 1.25rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="container">
        <!-- Self-designed modern Logo: Cross + Open Songbook + Acoustic Wave -->
        <div class="logo-wrapper">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="fishBlue" x1="40" y1="95" x2="165" y2="95" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="50%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
        <linearGradient id="ringGold" x1="60" y1="70" x2="100" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FDE047"/>
            <stop offset="50%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="ringRed" x1="100" y1="70" x2="140" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FDA4AF"/>
            <stop offset="50%" stop-color="#E11D48"/>
            <stop offset="100%" stop-color="#9F1239"/>
        </linearGradient>
    </defs>
    <rect x="15" y="15" width="170" height="170" rx="44" fill="#0D1B2A" stroke="#E0E1DD" stroke-width="1.5" stroke-opacity="0.3"/>
    <!-- Left Wedding Ring (Gold - Divine Glory) -->
    <circle cx="82" cy="95" r="23" stroke="url(#ringGold)" stroke-width="4.5" fill="none"/>
    <!-- Right Wedding Ring (Crimson - Human Love) -->
    <circle cx="118" cy="95" r="23" stroke="url(#ringRed)" stroke-width="4.5" fill="none"/>
    <!-- Iconic Ichthys / Esquif Outline (Fish of Christ) -->
    <!-- Upper arc crossing to lower tail -->
    <path d="M 38 95 C 65 52, 130 52, 155 95 L 172 118" stroke="url(#fishBlue)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Lower arc crossing to upper tail -->
    <path d="M 38 95 C 65 138, 130 138, 155 95 L 172 72" stroke="url(#fishBlue)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Fish eye -->
    <circle cx="56" cy="95" r="3" fill="#60A5FA"/>
    <!-- Interlacing highlights on the rings to show 3D interlocking -->
    <path d="M 95 80 A 23 23 0 0 1 105 95" stroke="url(#ringGold)" stroke-width="4.5" fill="none"/>
    <path d="M 95 110 A 23 23 0 0 0 105 95" stroke="url(#ringRed)" stroke-width="4.5" fill="none"/>
    <!-- Inscription -->
    <text x="100" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" fill="#E2E8F0" letter-spacing="1">ÉQUIPES NOTRE-DAME</text>
</svg>
        </div>

        <h1 class="app-title">Holyrics Mac</h1>
        <div class="app-subtitle">Prezenter Pieśni</div>
        
        <div class="version-badge">
            <span class="dot"></span>
            <span>Wersja 1.0.0 • Apple Silicon Native</span>
        </div>
    </div>

    <div class="footer-status">
        <div id="clock" class="live-clock">--:--</div>
        <div>GOTOWY DO PROJEKCJI • OCZEKIWANIE NA PREZENTACJĘ</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tylko odczyt repozytorium (R1-01); zadania niczego nie publikują.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build_app.sh liczy numer kompilacji z historii (N10)

      # Nierozwiązany konflikt scalania trafił raz do main w README i CLAUDE.md (R12-01).
      - name: No merge conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|>>>>>>>)( |$)|^=======$' -- . ':!*.xcstrings'; then
            echo "::error::Znaczniki konfliktu scalania w repozytorium"
            exit 1
          fi

      - name: Select the newest Xcode (no betas or release candidates)
        run: |
          # Bety i kandydaci wydania pomijani także pod dowiązaniami Xcode_26.5.app → …_beta_2.app (R1-04, R9-01).
          scripts/newest_xcode.sh --self-test
          XCODE="$(scripts/newest_xcode.sh)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      # Kod ma 0 ostrzeżeń; w CI ostrzeżenie przerywa budowanie (R1-14). Te same flagi w testach,
      # żeby `swift test` nie kompilował wszystkiego od nowa.
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      # Testy nie mogą sięgać do katalogu danych (R5-01): CANTATE_DATA_DIR wskazuje nieistniejący
      # katalog, który po testach nadal nie może istnieć (powstałby przy użyciu DataStore.shared).
      - name: Test
        run: |
          CANARY="$RUNNER_TEMP/cantate-data-canary"
          rm -rf "$CANARY"
          CANTATE_DATA_DIR="$CANARY" swift test -Xswiftc -warnings-as-errors
          if [ -e "$CANARY" ]; then
            echo "::error::Testy użyły prawdziwego katalogu danych (DataStore.shared/AppPaths.shared): $(ls -A "$CANARY")"
            exit 1
          fi

      - name: Remote control page check (headless Chrome)
        run: python3 -I scripts/remote_check.py

      - name: Package the app (no Google OAuth client in CI)
        run: |
          ./build_app.sh
          codesign --verify --strict build.noindex/CantatePresenter.app


name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tylko odczyt repozytorium (R1-01); zadania niczego nie publikują.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build_app.sh liczy numer kompilacji z historii (N10)

      - name: Select the newest Xcode (no betas)
        run: |
          # Bety (Xcode_27_beta.app, Xcode-beta.app) pomijane, żeby CI nie przechodziło na nie po cichu (R1-04).
          XCODE="$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      # Kod ma 0 ostrzeżeń; w CI ostrzeżenie przerywa budowanie (R1-14). Te same flagi w testach,
      # żeby `swift test` nie kompilował wszystkiego od nowa.
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      - name: Remote control page check (headless Chrome)
        run: python3 -I scripts/remote_check.py

      - name: Package the app (no Google OAuth client in CI)
        run: |
          ./build_app.sh
          codesign --verify --strict CantatePresenter.app


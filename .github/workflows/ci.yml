name: CI

on:
  push:
    branches: [main, stage3-quality]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build_app.sh liczy numer kompilacji z historii (N10)

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Web server tests
        run: python3 -I -m unittest discover -s web/server/tests

      - name: Web core tests (headless Chrome)
        run: web/run-tests.sh

      - name: Web UI check with login and TOTP (headless Chrome)
        run: python3 -I web/tools/ui_check.py

      - name: Web UI check over real HTTPS (temporary certificate)
        run: python3 -I web/tools/ui_check.py --tls

      - name: Remote control page check (headless Chrome)
        run: python3 -I web/tools/remote_check.py

      - name: QR encoder check (CoreImage decoder)
        run: python3 -I web/tools/qr_check.py

      - name: Package the app (no Google OAuth client in CI)
        run: |
          ./build_app.sh
          codesign --verify --strict CantatePresenter.app

  windows:
    name: Windows app (.NET 8, WinUI 3)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # numer wersji z historii (scripts/version.sh)

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Core tests (shared fixtures)
        run: dotnet test windows/tests/CantatePresenter.Core.Tests -c Release

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build and publish the app (win-x64, self-contained)
        run: dotnet publish windows/src/CantatePresenter.App -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ steps.version.outputs.value }} -o publish/CantatePresenter

      - name: Smoke test with screenshots (temporary data directory)
        shell: pwsh
        run: |
          $env:CANTATE_DATA_DIR = Join-Path $env:RUNNER_TEMP "cantate-data"
          $out = Join-Path $env:RUNNER_TEMP "smoke"
          $process = Start-Process -FilePath "publish/CantatePresenter/CantatePresenter.exe" -ArgumentList "--smoke-test", "`"$out`"" -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw "Aplikacja nie zakończyła próby w 3 minuty" }
          Get-Content (Join-Path $out "report.json")
          $report = Get-Content (Join-Path $out "report.json") | ConvertFrom-Json
          if ($report.failures.Count -gt 0) { throw "Nieudane sprawdzenia: $($report.failures -join ', ')" }
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item (Join-Path $out "*") smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-screenshots
          path: smoke
          if-no-files-found: ignore

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/CantatePresenter -DestinationPath "CantatePresenter-Windows-x64-${{ steps.version.outputs.value }}.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CantatePresenter-Windows-x64
          path: CantatePresenter-Windows-x64-*.zip

